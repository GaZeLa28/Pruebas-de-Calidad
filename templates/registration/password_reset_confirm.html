{% load static %}
<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Nueva contraseña | CoffeeTrace</title><link rel="stylesheet" href="{% static 'css/app.css' %}"></head><body class="login-body"><main class="auth-simple"><section class="login-card"><p class="eyebrow">Acceso seguro</p><h1>Defina una nueva contraseña</h1>{% if validlink %}<form method="post" class="stack-form">{% csrf_token %}<div class="field-group"><label for="id_new_password1">Nueva contraseña</label><input id="id_new_password1" name="new_password1" type="password" autocomplete="new-password" required></div><div class="field-group"><label for="id_new_password2">Confirmar contraseña</label><input id="id_new_password2" name="new_password2" type="password" autocomplete="new-password" required></div>{% if form.errors %}<div class="form-error">{{ form.errors }}</div>{% endif %}<button class="button button-primary button-full" type="submit">Actualizar contraseña</button></form>{% else %}<div class="form-error">El enlace ya expiró o no es válido.</div><a class="button button-primary button-full" href="{% url 'password_reset' %}">Solicitar otro enlace</a>{% endif %}</section></main></body></html>
