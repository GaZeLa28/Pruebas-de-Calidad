{% load static %}
<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Recuperar contraseña | CoffeeTrace</title><link rel="stylesheet" href="{% static 'css/app.css' %}"></head><body class="login-body"><main class="auth-simple"><section class="login-card"><p class="eyebrow">Acceso seguro</p><h1>Recuperar contraseña</h1><p class="muted">Ingrese el correo asociado a su usuario. Recibirá un enlace temporal.</p><form method="post" class="stack-form">{% csrf_token %}<div class="field-group"><label for="id_email">Correo electrónico</label><input id="id_email" name="email" type="email" autocomplete="email" required></div>{% if form.errors %}<div class="form-error">Revise el correo ingresado.</div>{% endif %}<button class="button button-primary button-full" type="submit">Enviar instrucciones</button></form><p class="login-help"><a href="{% url 'login' %}">← Volver al inicio de sesión</a></p></section></main></body></html>
